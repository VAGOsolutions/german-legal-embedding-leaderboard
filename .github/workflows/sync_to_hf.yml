name: Sync to Hugging Face Hub
on:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://user:$HF_TOKEN@huggingface.co/spaces/VAGOsolutions/german-legal-embedding-leaderboard main